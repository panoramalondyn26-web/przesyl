name: Zbuduj aplikacje
on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Przygotuj projekt
        run: bash ci_setup.sh android
      - name: Zbuduj APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Przesyl.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Przesyl-Android
          path: dist/Przesyl.apk

  macos:
    name: Mac (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Przygotuj projekt
        run: bash ci_setup.sh macos
      - name: Zbuduj aplikację
        run: flutter build macos --release
      - name: Spakuj do DMG
        run: |
          mkdir -p dmg dist
          cp -R build/macos/Build/Products/Release/przesyl.app "dmg/Przesył.app"
          ln -s /Applications "dmg/Aplikacje"
          hdiutil create -volname "Przesył" -srcfolder dmg -ov -format UDZO dist/Przesyl-Mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Przesyl-Mac
          path: dist/Przesyl-Mac.dmg

  windows:
    name: Windows (instalator)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Przygotuj projekt
        shell: bash
        run: bash ci_setup.sh windows
      - name: Zbuduj aplikację
        run: flutter build windows --release
      - name: Zbuduj instalator
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Przesyl-Windows
          path: dist/Przesyl-Windows-Instalator.exe
