name: Zbuduj APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Przygotuj projekt Android
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/
          [ -f transfer_service.dart ] && mv transfer_service.dart lib/
          flutter create --org com.przesyl --project-name przesyl --platforms=android .
          rm -f test/widget_test.dart
          flutter pub add file_selector path_provider
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"|' "$M"
          perl -pi -e 's|android:label="przesyl"|android:label="Przesył"|' "$M"
          cat "$M"

      - name: Zbuduj APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: przesyl-apk
          path: build/app/outputs/flutter-apk/app-release.apk
